# lab.conf - settings for the QEMU/KVM version of the homelab.
# Sourced by lab.sh and net.sh (bash syntax, bash 4+). Edit to match your host and lab.

# ---- Paths -------------------------------------------------------------------
LAB_DIR="${LAB_DIR:-/srv/lab}"
DISK_DIR="$LAB_DIR/disks"      # qcow2 disks
ISO_DIR="$LAB_DIR/iso"         # installation media
RUN_DIR="$LAB_DIR/run"         # pid files, QMP sockets, per-VM UEFI variable stores, TPM state

WIN_ISO="$ISO_DIR/ws2022-eval.iso"       # Windows Server 2022 installation ISO
VIRTIO_ISO="$ISO_DIR/virtio-win.iso"     # virtio drivers (see docs/qemu/host-setup.md)

# ---- Binaries and firmware ----------------------------------------------------
QEMU_BIN="qemu-system-x86_64"

# UEFI firmware. Paths differ per distro: run  ls /usr/share/OVMF /usr/share/edk2/ovmf  to check.
# Debian/Ubuntu (22.04+):  /usr/share/OVMF/OVMF_CODE_4M.fd   and OVMF_VARS_4M.fd
# Fedora:                  /usr/share/edk2/ovmf/OVMF_CODE.fd and OVMF_VARS.fd
OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
OVMF_VARS_TEMPLATE="/usr/share/OVMF/OVMF_VARS_4M.fd"
# Only needed for VMs with the 'secboot' flag (e.g. a Windows 11 client):
OVMF_CODE_SECBOOT="/usr/share/OVMF/OVMF_CODE_4M.secboot.fd"
OVMF_VARS_SECBOOT_TEMPLATE="/usr/share/OVMF/OVMF_VARS_4M.ms.fd"

# ---- Network ---------------------------------------------------------------------
# One Linux bridge per VLAN. The host owns the .1 address and acts as the router (see docs/qemu/networking.md).
declare -A BRIDGES=(
  [br-servers]="10.0.20.1/24"    # VLAN 20, Servers
  [br-clients]="10.0.30.1/24"    # VLAN 30, Clients
)
LAB_SUPERNET="10.0.0.0/16"       # everything in the lab; NATed out through the uplink
UPLINK="${UPLINK:-}"             # host interface to the internet; empty = auto-detect from the default route

# ---- VMs ---------------------------------------------------------------------------
# name|vCPUs|RAM|bridge|MAC|VNC display|flags|VM-Generation-ID
#   VNC display N listens on 127.0.0.1:590N
#   flags (comma separated): autostart, dc, tpm, secboot
#   VM-Generation-ID: fixed GUID for DCs. CHANGE IT (uuidgen) after restoring a snapshot or cloning a disk.
#   MAC plan: 52:54:00:<VLAN>:00:<last octet of IP>
VMS=(
  "dc01|2|4G|br-servers|52:54:00:20:00:10|1|autostart,dc|c12235bb-a8cb-4997-a702-be4dc6cced60"
  "dc02|2|4G|br-servers|52:54:00:20:00:11|2|autostart,dc|3f4af683-4f42-4999-846a-9e60562fda11"
  "file01|2|4G|br-servers|52:54:00:20:00:20|3|autostart|"
  "win11-01|2|4G|br-clients|52:54:00:30:00:20|4|tpm,secboot|"
)

# OS disk sizes (qcow2 files are sparse, they only use what the guest writes)
declare -A DISK_SIZES=( [dc01]=60G [dc02]=60G [file01]=60G [win11-01]=80G )
# Extra data disks: name -> "suffix:size"  (creates <name>-<suffix>.qcow2)
declare -A EXTRA_DISKS=( [file01]="data:500G" )

# ---- Behaviour -----------------------------------------------------------------------
START_DELAY=30      # seconds between starting autostart VMs (DC01 first, so AD/DNS are up for the rest)
STOP_TIMEOUT=180    # seconds to wait for a graceful shutdown before giving up
